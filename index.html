<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂 生日快乐特别献礼</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        romanticBg: '#0F0913',
                        cardBg: '#1A1224',
                        roseGold: '#F472B6',
                        roseGoldHover: '#EC4899',
                        goldAccent: '#FBBF24',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti for Fireworks -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* Smooth Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0F0913;
        }
        ::-webkit-scrollbar-thumb {
            background: #2D1B36;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4A2859;
        }

        /* Waterfall / Masonry Layout */
        .masonry-grid {
            column-count: 1;
            column-gap: 1.25rem;
        }
        @media (min-width: 640px) {
            .masonry-grid { column-count: 2; }
        }
        @media (min-width: 1024px) {
            .masonry-grid { column-count: 3; }
        }
        @media (min-width: 1280px) {
            .masonry-grid { column-count: 4; }
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1.25rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Danmaku Bullet Comments Styling */
        .danmaku-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 20;
        }
        .danmaku-item {
            position: absolute;
            white-space: nowrap;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: danmakuMove 8s linear infinite;
        }
        @keyframes danmakuMove {
            from { transform: translateX(100%); }
            to { transform: translateX(-150%); }
        }
    </style>
</head>
<body class="bg-romanticBg text-gray-100 min-h-screen font-sans antialiased selection:bg-roseGold selection:text-white relative overflow-x-hidden">

    <!-- Glowing Background Atmosphere Effect -->
    <div class="fixed inset-0 pointer-events-none z-0 opacity-40">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-pink-600/30 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-purple-600/30 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s;"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 4s;"></div>
    </div>

    <!-- Navigation Header -->
    <header class="sticky top-0 z-40 bg-romanticBg/80 backdrop-blur-xl border-b border-white/10 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <!-- Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 via-purple-500 to-amber-400 flex items-center justify-center text-white shadow-lg shadow-pink-500/20 animate-float">
                    <i data-lucide="cake" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        <span>Birthday Special</span>
                        <span class="text-xs px-2 py-0.5 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 text-white font-normal">生贺礼物版</span>
                    </h1>
                    <p class="text-xs text-pink-300/80" id="header-subtitle">为星月准备的独家回忆录 ✨</p>
                </div>
            </div>

            <!-- Controls (BGM Player & Fireworks Button) -->
            <div class="flex items-center gap-3">
                <button onclick="triggerFireworks()" class="px-3.5 py-1.5 rounded-full bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 text-xs font-medium flex items-center gap-1.5 transition-all shadow-sm">
                    <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
                    <span class="hidden sm:inline">放烟花 🎉</span>
                </button>
                <button onclick="toggleAudio()" id="bgm-btn" class="px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-gray-300 text-xs flex items-center gap-2 transition-all">
                    <i data-lucide="music" id="music-icon" class="w-4 h-4"></i>
                    <span id="music-text" class="hidden sm:inline">背景音乐</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hidden BGM Audio Element (Replace source with your background song) -->
    <audio id="bgm-audio" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-beautiful-dream-493.mp3" type="audio/mpeg">
    </audio>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10 space-y-12">

        <!-- Section 1: Hero Birthday Banner & Special Video Entry -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Heartfelt Birthday Card (Left 2 Columns) -->
            <div class="lg:col-span-2 rounded-3xl p-6 sm:p-8 bg-gradient-to-br from-pink-950/40 via-purple-950/30 to-cardBg border border-pink-500/20 shadow-2xl relative overflow-hidden flex flex-col justify-between">
                <div class="absolute -right-10 -bottom-10 opacity-10 text-pink-400 pointer-events-none">
                    <i data-lucide="gift" class="w-64 h-64"></i>
                </div>

                <div class="space-y-4">
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-pink-500/10 border border-pink-500/30 text-pink-300 text-xs font-semibold">
                        <i data-lucide="heart" class="w-3.5 h-3.5 fill-current text-pink-400"></i>
                        <span>HAPPY BIRTHDAY TO YOU</span>
                    </div>

                    <h2 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-200 via-purple-200 to-amber-200 tracking-tight leading-tight">
                        祝 <span id="recipient-name" class="underline decoration-pink-500/50 decoration-wavy">星月</span> 生日快乐！🎂
                    </h2>

                    <p id="birthday-message" class="text-gray-300 text-sm sm:text-base leading-relaxed max-w-2xl">
                        愿你的新一岁充满星光与温暖，所有的美好都如期而至。这是为你特别制作的生贺展示集，记录了那些闪闪发光的瞬间与回忆。

                </div>

                        <div class="text-base font-bold text-amber-300 flex items-center gap-1">

                    </div>
                    <button onclick="scrollToWaterfall()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white text-xs font-semibold shadow-lg shadow-pink-500/25 flex items-center gap-2 transition-all">

                        <i data-lucide="arrow-down" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Featured Video Portal Hero Card (Right 1 Column) -->

        <!-- Section 2: Waterfall Stream (瀑布流展示区) -->

                        <span>发一条弹幕祝福 🎉</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

        <div class="max-w-md w-full rounded-2xl bg-cardBg border border-white/10 p-6 space-y-4 relative shadow-2xl">
            <button onclick="closeWishModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h4 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="sparkles" class="w-5 h-5 text-amber-400"></i>
                <span>送上你的生日祝福</span>
            </h4>
            <div class="space-y-3">
                <input type="text" id="wish-sender" placeholder="你的名字 / 署名" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-pink-500" />
                <textarea id="wish-text" rows="3" placeholder="写下你想对TA说的祝福语..." class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-pink-500"></textarea>
            </div>
            <button onclick="submitWish()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 text-white text-xs font-semibold shadow-lg shadow-pink-500/25">
                确认发送并放烟花 ✨
            </button>
        </div>
    </div>

                title: '☕ 惬意的咖啡时光',
                desc: '和你在一起聊天的下午总是过得特别快。',
                url: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1000&q=80',
                date: '2026-02-14',
                tag: '独家回忆'
            }
        ];

        // 3. 预载的生日祝福语列表 (Preloaded Wishes)
        let WISHES_DATA = [
            { sender: '好友 小明', text: '星月生日快乐！愿你永远快乐自由，所求皆所愿！✨', time: '刚刚' },
            { sender: '阿杰', text: '新的一岁也要继续发光发亮！生贺视频超赞！🎉', time: '10分钟前' },
            { sender: '摄影师朋友', text: '🎂 祝你天天都有好心情，照片和视频都超美的！', time: '1小时前' }
        ];

        // 4. 弹幕预设文字 (Danmaku Wishes)
        const DANMAKU_PRESETS = [
            "🎂 祝星月生日快乐！",
            "✨ 愿你永远快乐，星光璀璨！",
            "🎉 Happy Birthday!! 快乐每一天！",
            "💖 永远十八岁！要一直开心！",
            "🌸 所有的美好都属于你！"
        ];

        /* ==================== STATE VARIABLES ==================== */
        let currentFilter = 'all';
        let currentIndex = 0;
        let filteredItems = [];
        let isAudioPlaying = false;
        let danmakuInterval = null;

        /* ==================== INITIALIZATION ==================== */
        document.addEventListener('DOMContentLoaded', () => {
            initAppInfo();
            renderGrid();
            renderWishes();
            lucide.createIcons();

            // Keyboard navigation for Lightbox
            document.addEventListener('keydown', (e) => {
                const lightbox = document.getElementById('lightbox');
                if (!lightbox.classList.contains('hidden')) {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') navigateLightbox(-1);
                    if (e.key === 'ArrowRight') navigateLightbox(1);
                }
            });
        });

        // Populate Config Info
        function initAppInfo() {
            document.getElementById('recipient-name').textContent = BIRTHDAY_CONFIG.recipientName;
            document.getElementById('header-subtitle').textContent = BIRTHDAY_CONFIG.subtitle;
            document.getElementById('birthday-message').textContent = BIRTHDAY_CONFIG.message;
            document.getElementById('days-count').textContent = BIRTHDAY_CONFIG.togetherDays;

            // Featured Card Config
            document.getElementById('featured-title').textContent = BIRTHDAY_CONFIG.featuredVideo.title;
            document.getElementById('featured-desc').textContent = BIRTHDAY_CONFIG.featuredVideo.desc;
            document.getElementById('featured-poster').src = BIRTHDAY_CONFIG.featuredVideo.poster;
        }

        /* ==================== WATERFALL / MASONRY LOGIC ==================== */
        function renderGrid() {
            const grid = document.getElementById('media-grid');
            grid.innerHTML = '';

            filteredItems = currentFilter === 'all'
                ? MEDIA_ITEMS
                : MEDIA_ITEMS.filter(item => item.category === currentFilter);

            document.getElementById('visible-count').textContent = filteredItems.length;

            filteredItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'masonry-item animate-fade-in group relative rounded-2xl overflow-hidden bg-cardBg border border-white/10 shadow-lg cursor-pointer transform transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl hover:border-pink-500/40';
                card.onclick = () => openLightbox(index);

                let mediaContent = '';
                if (item.type === 'video') {
                    mediaContent = `
                        <div class="relative w-full">
                            <img src="${item.poster || 'https://placehold.co/600x400/1A1224/FFF?text=Video'}" alt="${item.title}" loading="lazy" class="w-full h-auto object-cover transition-transform duration-500 group-hover:scale-105" />
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center transition-opacity group-hover:bg-black/20">
                                <div class="w-12 h-12 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 text-white flex items-center justify-center shadow-lg transform transition-transform group-hover:scale-110">
                                    <i data-lucide="play" class="w-6 h-6 fill-current ml-0.5"></i>
                                </div>
                            </div>
                            <span class="absolute top-3 right-3 px-2.5 py-1 rounded-md bg-black/60 backdrop-blur-md text-[10px] font-semibold text-pink-300 border border-white/10">
                                🎬 视频
                            </span>
                        </div>
                    `;
                } else {
                    mediaContent = `
                        <div class="relative w-full">
                            <img src="${item.url}" alt="${item.title}" loading="lazy" class="w-full h-auto object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://placehold.co/600x400/1A1224/FFF?text=Image+Failed'" />
                            <span class="absolute top-3 right-3 px-2.5 py-1 rounded-md bg-black/60 backdrop-blur-md text-[10px] font-semibold text-purple-300 border border-white/10">
                                📷 照片
                            </span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${mediaContent}
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4">
                        <span class="text-[10px] text-pink-300 font-semibold mb-1">${item.tag || item.date}</span>
                        <h4 class="text-sm font-bold text-white leading-tight">${item.title}</h4>
                        <p class="text-xs text-gray-300 mt-1 line-clamp-2">${item.desc}</p>
                    </div>
                `;

                grid.appendChild(card);
            });

            lucide.createIcons();
        }

        // Filter Function
        function filterMedia(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-gradient-to-r', 'from-pink-500', 'to-purple-600', 'text-white', 'shadow-md');
                btn.classList.add('bg-white/5', 'text-gray-400');
            });
            event.currentTarget.classList.remove('bg-white/5', 'text-gray-400');
            event.currentTarget.classList.add('bg-gradient-to-r', 'from-pink-500', 'to-purple-600', 'text-white', 'shadow-md');
            renderGrid();
        }

        function scrollToWaterfall() {
            document.getElementById('waterfall-section').scrollIntoView({ behavior: 'smooth' });
        }

        function loadMoreItems() {
            // Simulated continuous infinite scroll effect
            const btn = document.getElementById('load-more-btn');
            const notice = document.getElementById('end-notice');
            btn.innerHTML = `<span>加载中...</span>`;
            setTimeout(() => {
                btn.classList.add('hidden');
                notice.classList.remove('hidden');
            }, 800);
        }

        /* ==================== LIGHTBOX & CINEMA VIDEO PORTAL ==================== */
        function openLightbox(index) {
            currentIndex = index;
            const lightbox = document.getElementById('lightbox');
            updateLightboxContent();

            lightbox.classList.remove('hidden');
            setTimeout(() => lightbox.classList.remove('opacity-0'), 10);
        }

        function openFeaturedVideo() {
            const container = document.getElementById('lightbox-media-wrapper');
            const title = document.getElementById('lightbox-title');
            const desc = document.getElementById('lightbox-desc');
            const videoActions = document.getElementById('video-actions');

            title.innerHTML = `<span>${BIRTHDAY_CONFIG.featuredVideo.title}</span>`;
            desc.textContent = BIRTHDAY_CONFIG.featuredVideo.desc;
            videoActions.classList.remove('hidden');

            container.innerHTML = `
                <video controls autoplay class="w-full h-full object-contain">
                    <source src="${BIRTHDAY_CONFIG.featuredVideo.videoUrl}" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
            `;

            startDanmaku();

            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('hidden');
            setTimeout(() => lightbox.classList.remove('opacity-0'), 10);
        }

        function updateLightboxContent() {
            const item = filteredItems[currentIndex];
            const container = document.getElementById('lightbox-media-wrapper');
            const title = document.getElementById('lightbox-title');
            const desc = document.getElementById('lightbox-desc');
            const videoActions = document.getElementById('video-actions');

            title.innerHTML = `<span>${item.title}</span>`;
            desc.textContent = `${item.date} — ${item.desc}`;

            if (item.type === 'video') {
                videoActions.classList.remove('hidden');
                container.innerHTML = `
                    <video controls autoplay class="w-full h-full object-contain">
                        <source src="${item.url}" type="video/mp4">
                        您的浏览器不支持视频播放。
                    </video>
                `;
                startDanmaku();
            } else {
                videoActions.classList.add('hidden');
                stopDanmaku();
                container.innerHTML = `
                    <img src="${item.url}" alt="${item.title}" class="w-full h-full object-contain" />
                `;
            }
        }

        function navigateLightbox(dir) {
            if (!filteredItems.length) return;
            currentIndex = (currentIndex + dir + filteredItems.length) % filteredItems.length;
            updateLightboxContent();
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('opacity-0');
            stopDanmaku();
            setTimeout(() => {
                lightbox.classList.add('hidden');
                document.getElementById('lightbox-media-wrapper').innerHTML = '';
            }, 300);
        }

        /* ==================== DANMAKU (弹幕) EFFECT ==================== */
        function startDanmaku() {
            stopDanmaku();
            const layer = document.getElementById('danmaku-layer');
            layer.innerHTML = '';
            
            // Spawn initial preset comments
            DANMAKU_PRESETS.forEach((msg, idx) => {
                setTimeout(() => createDanmakuItem(msg), idx * 1500);
            });

            danmakuInterval = setInterval(() => {
                const randomMsg = DANMAKU_PRESETS[Math.floor(Math.random() * DANMAKU_PRESETS.length)];
                createDanmakuItem(randomMsg);
            }, 3500);
        }

        function stopDanmaku() {
            if (danmakuInterval) clearInterval(danmakuInterval);
            document.getElementById('danmaku-layer').innerHTML = '';
        }

        function createDanmakuItem(text) {
            const layer = document.getElementById('danmaku-layer');
            const el = document.createElement('div');
            el.className = 'danmaku-item';
            el.textContent = text;
            el.style.top = `${Math.floor(Math.random() * 60) + 10}%`;
            layer.appendChild(el);

            setTimeout(() => el.remove(), 8000);
        }

        function sendQuickDanmaku() {
            const text = prompt("发送一条实时生贺弹幕：", "🎂 祝星月生日快乐！");
            if (text) {
                createDanmakuItem("✨ " + text);
                triggerFireworks();
            }
        }

        /* ==================== WISH WALL & FIREWORKS ==================== */
        function renderWishes() {
            const grid = document.getElementById('wishes-grid');
            grid.innerHTML = '';
            WISHES_DATA.forEach(w => {
                const card = document.createElement('div');
                card.className = 'p-4 rounded-2xl bg-white/5 border border-white/10 space-y-2 relative overflow-hidden';
                card.innerHTML = `
                    <div class="flex items-center justify-between text-xs text-pink-300">
                        <span class="font-bold flex items-center gap-1"><i data-lucide="user" class="w-3.5 h-3.5"></i> ${w.sender}</span>
                        <span class="text-gray-500">${w.time}</span>
                    </div>
                    <p class="text-xs sm:text-sm text-gray-200">${w.text}</p>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function openWishModal() {
            document.getElementById('wish-modal').classList.remove('hidden');
        }

        function closeWishModal() {
            document.getElementById('wish-modal').classList.add('hidden');
        }

        function submitWish() {
            const sender = document.getElementById('wish-sender').value.trim() || '热心好友';
            const text = document.getElementById('wish-text').value.trim();

            if (!text) {
                alert('请填写祝愿语哦！');
                return;
            }

            WISHES_DATA.unshift({ sender, text, time: '刚刚' });
            renderWishes();
            closeWishModal();
            triggerFireworks();

            document.getElementById('wish-sender').value = '';
            document.getElementById('wish-text').value = '';
        }

        // Trigger Canvas Confetti Fireworks
        function triggerFireworks() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        /* ==================== BGM AUDIO PLAYER ==================== */
        function toggleAudio() {
            const audio = document.getElementById('bgm-audio');
            const icon = document.getElementById('music-icon');
            const text = document.getElementById('music-text');

            if (isAudioPlaying) {
                audio.pause();
                icon.setAttribute('data-lucide', 'music');
                text.textContent = '背景音乐';
            } else {
                audio.play().then(() => {
                    icon.setAttribute('data-lucide', 'disc');
                    text.textContent = '播放中 🎶';
                }).catch(() => {
                    alert('请手动允许浏览器播放音乐');
                });
            }
            isAudioPlaying = !isAudioPlaying;
            lucide.createIcons();
        }
    </script>
</body>
</html>
